    <!-- データ保存フォルダ選択ボタン -->

    <!-- 検索オプション4 男子／女子 選択ラジオボタン（大会選択時） -->

      id="radioArea4"
      style="
        display: none;
        margin-top: 5px;

        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
        width: fit-content;

      "
    >
      <label

          font-size: 12px;
          display: inline-flex;

        "
      >
        <input
          type="radio"
          name="option4"

    <!-- 検索実行ボタン -->

    <table id="dispTable" style="display: none">
      <thead>
        <tr id="tableHeader"></tr>
      </thead>
      <tbody id="tableBody"></tbody>

    <script>
      // 検索オプション1 大会区分
      const OPTION1_VALUE_JP = "1";
      const OPTION1_VALUE_WC = "2";
      const OPTION1_VALUE_CC = "3";
      const OPTION1_VALUE_SG = "4";

      // フォルダ選択ボタン
      const folderInput = document.getElementById("folderInput");
      const customBtn = document.getElementById("customBtn");

      // オプション1選択ラジオボタン
      const radioArea1 = document.getElementById("radioArea1");
      // オプション2選択ラジオボタン
      const radioArea2 = document.getElementById("radioArea2");
      // オプション3選択ラジオボタン
      const radioArea3 = document.getElementById("radioArea3");
      // 大会選択ボックス
      const compSelectBox = document.getElementById("compSelectBox");
      // オプション4選択ラジオボタン
      const radioArea4 = document.getElementById("radioArea4");
      // 検索ボタン
      const searchBtn = document.getElementById("searchBtn");

      // 「フォルダを選択」ボタンが押されたら、本物のボタンを代わりにクリックする
      //customBtn.addEventListener("click", () => {
      //  folderInput.click();
      //});

      const GITHUB_ZIP_FILE_NAME = "data/result.zip";
      //const GITHUB_ZIP_FILE_NAME = "data/version.txt";

      let directoryHandle;

      async function dataDownLoad() {
        //    const statusDiv = document.getElementById('status');
        // statusDiv.className = '';
        console.log("dataSownLoad 1");

        return new Promise((resolve, reject) => {
          //  statusDiv.innerHTML = "2. サーバーから最新の圧縮ファイルを取得中...";
          console.log("dataDownload 1: 通信開始");

          // 💡 フリーズの原因だった fetch と arrayBuffer() を完全に廃止し、
          // 最もフリーズが起きない伝統的な通信方式(XMLHttpRequest)でバイナリデータを取得します
          const xhr = new XMLHttpRequest();
          xhr.open(
            "GET",
            GITHUB_ZIP_FILE_NAME + "?t=" + new Date().getTime(),
            true,
          ); // キャッシュ対策のパラメータ付き
          xhr.responseType = "arraybuffer"; // 💡最初からフリーズなしで arraybuffer として受け取る指定

          xhr.onload = async function () {
            console.log("dataDownload 2: ステータス確認", xhr.status);

            if (xhr.status !== 200) {
              statusDiv.className = "error";
              statusDiv.innerHTML = `ファイル取得に失敗しました。ステータスコード: ${xhr.status}\n同じフォルダ内に「${LOCAL_ZIP_FILE_NAME}」があるか確認してください。`;
              // ❌ 失敗した時も待機を解除する
              reject(new Error(`ステータスコード: ${xhr.status}`));
              return;
            }

            // 💡 既にフリーズなしで安全にデータが格納されています
            const zipBuffer = xhr.response;
            console.log(
              "dataDownload 3: バイナリデータの取得成功。バイト数:",
              zipBuffer.byteLength,
            );

            //  statusDiv.innerHTML =
            //    "3. ファイルのダウンロード完了。指定フォルダ直下へ自動解凍中...";

            try {
              // JSZipライブラリを使ってブラウザ内で展開
              const zip = new JSZip();
              const unzippedData = await zip.loadAsync(zipBuffer);

              let fileCount = 0;
              for (const relativePath in unzippedData.files) {
                const zipEntry = unzippedData.files[relativePath];

                if (!zipEntry.dir) {
                  // 💡 解決策: 先頭がドットで始まる隠しファイルや、Mac特有の不要なシステムファイルを無視する
                  if (
                    zipEntry.name.startsWith(".") ||
                    zipEntry.name.includes("__MACOSX")
                  ) {
                    console.log(
                      `システムファイルのためスキップしました: ${zipEntry.name}`,
                    );
                    continue; // 保存せずに次のファイルへ進む
                  }
                  const fileBlob = await zipEntry.async("blob");

                  // 選択されたフォルダ内に同名ファイルを作成・上書き
                  const fileHandle = await directoryHandle.getFileHandle(
                    zipEntry.name,
                    { create: true },
                  );
                  const writable = await fileHandle.createWritable();
                  await writable.write(fileBlob);
                  await writable.close();
                  fileCount++;
                }
              }

              //  statusDiv.className = "success";
              //  statusDiv.innerHTML = `【完了】\n選択したフォルダの中に、すべてのファイル（計 ${fileCount} 件）を直接解凍・保存しました！`;
              console.log("dataDownload 4: すべての処理が正常完了しました");

              // ========================================================
              // 💡 完了通知！ これを呼ぶことで、ボタン側の「await dataDownLoad()」の
              // 一時停止が解除され、次のラジオボタン非表示などの処理へ進みます。
              // ========================================================
              resolve();
            } catch (unzipErr) {
              //  statusDiv.className = "error";
              //  statusDiv.innerHTML =
              //    "解凍または書き込み処理中にエラーが発生しました:\n" +
              //    unzipErr.message;
              console.error("エラー詳細:", unzipErr);
              // ❌ 解凍エラーの時も待機を解除する
              reject(unzipErr);
            }
          };

          xhr.onerror = function () {
            //  statusDiv.className = "error";
            //  statusDiv.innerHTML = "通信エラーが発生しました。";
            console.error("XHR通信エラー");
            reject(new Error("ネットワークエラーが発生しました。"));
          };

          xhr.send();
        });
      }

      // フォルダが選択時の処理
      // 選択されたフォルダ内のファイルのリストを取得
      //  folderInput.addEventListener("change", (event) => {
      customBtn.addEventListener("click", async (event) => {
        directoryHandle = await window.showDirectoryPicker({
          mode: "readwrite",
        });

        // ファイルダウンロード
        await dataDownLoad();

        // option3ラジオボタンを非表示
        radioArea3.style.display = "none";
        const option3Radios = document.getElementsByName("option3");
        option3Radios.forEach((radio) => {
          radio.checked = false;
        });

        // option4ラジオボタンを非表示
        radioArea4.style.display = "none";
        const option4Radios = document.getElementsByName("option4");
        option4Radios.forEach((radio) => {
          radio.checked = false;
        });

        // 大会選択ボックスを非表示
        compSelectBox.style.display = "none";

        // 選手選択ボックスを非表示
        compSelectBox.style.display = "none";

        // 検索ボタン非表示
        searchBtn.style.display = "none";

        // 表を非表示
        dispTable.style.display = "none";

        // オプション1選択ラジオボタン表示
        const option1Radios = document.getElementsByName("option1");
        option1Radios.forEach((radio) => {
          radio.checked = false;
        });
        radioArea1.style.display = "block";

        // オプション2選択ラジオボタン表示
        const option2Radios = document.getElementsByName("option2");
        option2Radios.forEach((radio) => {
          radio.checked = false;
        });
        radioArea2.style.display = "block";

        // 💡 showDirectoryPicker用の正しいファイル一覧取得処理
        const filePaths = [];

        // フォルダ内を非同期でループ処理し、ファイル名を集める
        for await (const entry of directoryHandle.values()) {
          if (entry.kind === "file") {
            filePaths.push(entry.name);
          }
        }

        //  const files = event.target.files;
        //  if (files.length === 0) return;

        //  const filePaths = [];
        //  for (let i = 0; i < files.length; i++) {
        //    filePaths.push(files[i].webkitRelativePath);
        //  }

        // 選択された全ファイルのリストをそのまま保存
        window.selectedFiles = event.target.files;
      });

      // option1ラジオボタンを変更した場合の処理
      document.getElementsByName("option1").forEach((radio) => {
        radio.addEventListener("change", (e) => {
          // option2ラジオボタンを初期化
          const option2Radios = document.getElementsByName("option2");
          option2Radios.forEach((radio) => {
            radio.checked = false;
          });

          // option3ラジオボタンを非表示
          radioArea3.style.display = "none";
          const option3Radios = document.getElementsByName("option3");
          option3Radios.forEach((radio) => {
            radio.checked = false;
          });

          // option4ラジオボタンを非表示
          radioArea4.style.display = "none";
          const option4Radios = document.getElementsByName("option4");
          option4Radios.forEach((radio) => {
            radio.checked = false;
          });

          // 大会選択ボックスを非表示
          compSelectBox.style.display = "none";

          // 選手選択ボックスを非表示
          playerSelectBox.style.display = "none";

          // 検索ボタン非表示
          searchBtn.style.display = "none";

          // 表を非表示
          dispTable.style.display = "none";
        });
      });

      // option2ラジオボタンを変更した場合の処理
      document.getElementsByName("option2").forEach((radio) => {
        radio.addEventListener("change", async (e) => {
          // option2 選択項目取得
          const select_option = document.querySelector(
            'input[name="option2"]:checked',
          ).value;

          // 検索ボタン非表示
          searchBtn.style.display = "none";

          // option4ラジオボタンを非表示
          radioArea4.style.display = "none";
          const option4Radios = document.getElementsByName("option4");
          option4Radios.forEach((radio) => {
            radio.checked = false;
          });

          // option3ラジオボタンを初期化
          const option3Radios = document.getElementsByName("option3");
          option3Radios.forEach((radio) => {
            radio.checked = false;
          });

          // 大会選択ボックスを非表示
          compSelectBox.style.display = "none";

          // 選手選択ボックスを非表示
          playerSelectBox.style.display = "none";

          // 表を非表示
          dispTable.style.display = "none";

          // 「総合順位」「個人」が選択された場合
          if (
            select_option === "option2_overall" ||
            select_option === "option2_personal"
          ) {
            // option3ラジオボタンが非表示の場合
            if (radioArea3.style.display === "none") {
              // option3ラジオボタンを表示
              radioArea3.style.display = "block";
            }
          } else {
            // option3ラジオボタンが表示されている場合
            if (radioArea3.style.display === "block") {
              // option3ラジオボタンを非表示
              radioArea3.style.display = "none";
            }

            const COMPETITION_FILE_NAME = "competitionList.csv";

            const option1Value = document.querySelector(
              'input[name="option1"]:checked',
            ).value;

            // 大会選択ボックス表示
            try {
              // 1. 保存してあるフォルダ（directoryHandle）から直接ファイルを取得
              const fileHandle = await directoryHandle.getFileHandle(
                COMPETITION_FILE_NAME,
              );

              // 2. ファイルオブジェクトを取得
              const file = await fileHandle.getFile();

              // 3. FileReaderを使わずに、直接テキスト（UTF-8）として読み込む
              const content = await file.text();

              // ==========================================
              // ここから下は元々書いていただいた解析ロジックをそのまま活用
              // ==========================================

              // 改行で分割して配列にする
              const lines = content.split("\n");

              compSelectBox.innerHTML =
                '<option value="">-- 大会名を選択してください --</option>';

              let index = 0;
              // 1行ずつ順番に処理を実行
              lines.forEach((line) => {
                if (index === 0) {
                  index = index + 1;
                  return;
                }

                index = index + 1;

                if (!line.trim()) return;

                const cols = line.split(",");
                if (cols[3] !== option1Value) return;

                const text = cols[0].trim() + " " + cols[1].trim(); // 1列目
                const value = cols[1].trim();

                const option = document.createElement("option");
                option.value = value;
                option.textContent = text;
                compSelectBox.appendChild(option);
              });

              // セレクトボックスを表示
              compSelectBox.style.display = "block";
            } catch (err) {
              if (err.name === "NotFoundError") {
                console.error(
                  `ファイルが見つかりません: ${COMPETITION_FILE_NAME}`,
                );
                alert(
                  `フォルダ内に「${COMPETITION_FILE_NAME}」が存在しません。`,
                );
              } else {
                console.error("ファイル読み込みエラー:", err);
              }
            }
          }
        });
      });

      const PLAYER_LIST_JP = "player_jp.csv";
      const PLAYER_LIST_WC = "player_wc.csv";
      const PLAYER_LIST_CC = "player_cc.csv";
      const PLAYER_LIST_SG = "player_sg.csv";

      // 選手名リストCSVファイル名取得
      // IN: opt1 大会区分
      function getPlayerList(opt1) {
        let csvFile = "";
        if (opt1 === OPTION1_VALUE_JP) {
          csvFile = PLAYER_LIST_JP;
        } else if (opt1 === OPTION1_VALUE_WC) {
          csvFile = PLAYER_LIST_WC;
        } else if (opt1 === OPTION1_VALUE_CC) {
          csvFile = PLAYER_LIST_CC;
        } else if (opt1 === OPTION1_VALUE_SG) {
          csvFile = PLAYER_LIST_SG;
        }
        return csvFile;
      }

      // option3ラジオボタンを変更した場合の処理
      document.getElementsByName("option3").forEach((radio) => {
        // 💡 修正ポイント：await を使うために先頭に「async」を追加
        radio.addEventListener("change", async (e) => {
          // 検索ボタンを非表示
          searchBtn.style.display = "none";
          // 表を非表示
          dispTable.style.display = "none";

          // option1、option2 選択項目取得
          const option1 = document.querySelector(
            'input[name="option1"]:checked',
          ).value;
          const option2 = document.querySelector(
            'input[name="option2"]:checked',
          ).value;
          const option3 = document.querySelector(
            'input[name="option3"]:checked',
          ).value;

          // 「個人」が選択された場合
          if (option2 === "option2_personal") {
            // 選手選択ボックスを非表示
            compSelectBox.style.display = "none";
            // 選手リストファイル名取得
            csvFile = getPlayerList(option1);

            // ==========================================
            // 💡 修正ポイント：FileReader を使わず、directoryHandle から直接読み込む
            // ==========================================
            try {
              // 1. フォルダ内から対象のCSVファイルのハンドルを取得
              const fileHandle = await directoryHandle.getFileHandle(csvFile);

              // 2. ファイルオブジェクトを取得
              const file = await fileHandle.getFile();

              // 3. テキストとして一瞬で読み込む
              const content = await file.text();

              // 改行で分割して配列にする
              const lines = content.split(/\r\n|\n/);

              playerSelectBox.innerHTML =
                '<option value="">-- 選手を選択してください --</option>';

              let index = 0;
              // 1行ずつ順番に処理を実行
              lines.forEach((line) => {
                if (index === 0) {
                  index = index + 1;
                  return;
                }

                index = index + 1;

                if (!line.trim()) return;

                const cols = line.split(",");

                // 💡 配列の安全性を考慮してオプショナルチェーニング（?.）を使用
                if (cols[0]?.trim() !== option3) return;
                //if (cols[2]?.trim() !== option1) return;

                let text = cols[1]?.trim() || "";
                if (cols.length === 4) {
                  text = text + "(" + cols[2].trim() + ")";
                }
                const value = cols[1]?.trim() || "";

                const option = document.createElement("option");
                option.value = value;
                option.textContent = text;
                playerSelectBox.appendChild(option);
              });

              // 選手選択ボックスを表示
              playerSelectBox.style.display = "block";
            } catch (err) {
              if (err.name === "NotFoundError") {
                console.error(`ファイルが見つかりません: ${csvFile}`);
                alert(
                  `フォルダ内に選手リストファイル「${csvFile}」が存在しません。`,
                );
              } else {
                console.error("ファイル読み込みエラー:", err);
              }
            }
          } else if (option2 === "option2_overall") {
            // 検索ボタンを表示
            searchBtn.style.display = "block";
          }
        });
      });

      // option4ラジオボタンを変更した場合の処理
      document.getElementsByName("option4").forEach((radio) => {
        radio.addEventListener("change", (e) => {
          // 検索ボタンを非表示
          searchBtn.style.display = "block";
          // 表を非表示
          dispTable.style.display = "none";
        });
      });

      // 検索ボタンクリック時の処理
      searchBtn.addEventListener("click", () => {
        search();
      });

      // 大会名選択時の処理
      compSelectBox.addEventListener("change", function () {
        // option4ラジオボタンを表示
        radioArea4.style.display = "block";
        // option3ラジオボタンを初期化
        const option4Radios = document.getElementsByName("option4");
        option4Radios.forEach((radio) => {
          radio.checked = false;
        });
        // 表を非表示
        dispTable.style.display = "none";
        // 検索ボタンを非表示
        searchBtn.style.display = "none";
      });

      // 選手名選択時の処理
      playerSelectBox.addEventListener("change", function () {
        // 表を非表示
        dispTable.style.display = "none";
        // 検索ボタンを表示
        searchBtn.style.display = "block";
      });

      let search_result = "";

      // 総合順位情報検索
      // IN: csvFile 検索対象CSVファイル名
      // IN: option1Value 大会区分
      // IN: option3Value 男子／女子
      // IN: option2Value 総合順位／個人／大会
      async function searchOverall(
        csvFile,
        option1Value,
        option3Value,
        option2Value,
      ) {
        let result = "";

        console.log("csvfile:", csvFile);
        try {
          // 1. 保存してあるフォルダ（directoryHandle）から直接引数のCSVファイルを取得
          const fileHandle = await directoryHandle.getFileHandle(csvFile);

          console.log("searchOverall 1");

          // 2. ファイルオブジェクトを取得
          const file = await fileHandle.getFile();

          console.log("searchOverall 2");

          // 3. FileReaderを使わずに、直接テキスト（UTF-8）として読み込む
          const content = await file.text();

          // 改行で分割して配列にする
          const lines = content.split("\n");
          let index = 0;

          // ========================================================
          // 💡 修正ポイント：個人検索か、シーズン全体検索かで条件分岐を分ける（二重実行を防ぐ）
          // ========================================================
          if (option2Value === "option2_personal") {
            // 選手名取得
            const player = getPlayerName();

            // 【パターンA】個人検索用のループ処理
            lines.forEach((line) => {
              if (!line.trim()) return;

              const cols = line.split(",");
              if (cols[2]?.trim() === player || index === 0) {
                index++;
                let str = ""; // 💡 宣言位置を修正してスコープエラーを回避
                if (option1Value === OPTION1_VALUE_JP) {
                  str =
                    (cols[1] ? cols[1].trim() : "") +
                    "," + // 順位
                    (cols[2] ? cols[2].trim() : "") +
                    "," + // 名前
                    (cols[3] ? cols[3].trim() : "") +
                    "\n"; // ポイント
                } else {
                  str =
                    (cols[1] ? cols[1].trim() : "") +
                    "," + // 順位
                    (cols[2] ? cols[2].trim() : "") +
                    "," + // 名前
                    (cols[3] ? cols[3].trim() : "") +
                    "," + // 国
                    (cols[4] ? cols[4].trim() : "") +
                    "\n"; // ポイント
                }
                result += str;
              }
            });
          } else {
            // 【パターンB】シーズン全体検索用のループ処理
            lines.forEach((line) => {
              if (!line.trim()) return;

              const cols = line.split(",");
              if ((cols[0] && cols[0].trim() === option3Value) || index === 0) {
                index++;
                if (option1Value === OPTION1_VALUE_JP) {
                  str =
                    (cols[1] ? cols[1].trim() : "") +
                    "," + // 順位
                    (cols[2] ? cols[2].trim() : "") +
                    "," + // 名前
                    (cols[3] ? cols[3].trim() : "") +
                    "\n"; // ポイント
                } else {
                  console.log("大会区分：", option1Value);

                  str =
                    (cols[1] ? cols[1].trim() : "") +
                    "," + // 順位
                    (cols[2] ? cols[2].trim() : "") +
                    "," + // 名前
                    (cols[3] ? cols[3].trim() : "") +
                    "," + // 国
                    (cols[4] ? cols[4].trim() : "") +
                    "\n"; // ポイント
                }
                result += str;
              }
            });
          }

          // 💡 修正ポイント：すべての行のループ解析が完全に終わった後で、1回だけ画面に結果を反映する
          resultDisplay(result);
        } catch (err) {
          if (err.name === "NotFoundError") {
            console.error(`ファイルが見つかりません: ${csvFile}`);
            alert(
              `フォルダ内に指定されたファイル「${csvFile}」が存在しません。`,
            );
          } else {
            console.error("総合データの読み込み中にエラーが発生しました:", err);
          }
        }
      }

      // 大会の成績検索
      // IN: csvFile 検索対象CSVファイル名
      // IN: competitionName 大会名
      // IN: option4Value 男子／女子
      async function searchCompetition(csvFile, competitionName, option4Value) {
        let result = "";
        search_result = "";

        try {
          // 1. 保存してあるフォルダ（directoryHandle）から直接引数のCSVファイルを取得
          const fileHandle = await directoryHandle.getFileHandle(csvFile);

          // 2. ファイルオブジェクトを取得
          const file = await fileHandle.getFile();

          // 3. FileReaderを使わずに、直接テキスト（UTF-8）として読み込む
          const content = await file.text();

          // ==========================================
          // ここから下は解析ロジックを最適化して流用
          // ==========================================

          // 改行で分割して配列にする
          const lines = content.split("\n");

          let index = 0;

          // 1行ずつ順番に処理を実行
          lines.forEach((line) => {
            if (!line.trim()) return;

            const cols = line.split(",");
            if (
              (cols[0].trim() === competitionName &&
                cols[2].trim() === option4Value) ||
              index === 0
            ) {
              index++;
              const str =
                cols[3].trim() +
                "," + // 順位
                cols[4].trim() +
                "," + // 名前
                cols[5].trim() +
                "," + // 所属
                cols[6].trim() +
                "," + // 合計得点
                cols[7].trim() +
                "," + // 1本目飛距離
                cols[8].trim() +
                "," + // 1本目飛距離点
                cols[9].trim() +
                "," + // 1本目飛型点
                cols[10].trim() +
                "," + // 1本目得点
                cols[11].trim() +
                "," + // 1本目順位
                cols[12].trim() +
                "," + // 2本目飛距離
                cols[13].trim() +
                "," + // 2本目飛距離点
                cols[14].trim() +
                "," + // 2本目飛型点
                cols[15].trim() +
                "," + // 2本目得点
                cols[16].trim() +
                "," + // 2本目順位
                cols[17].trim() +
                "\n"; // ポイント

              result += str;
            }
          });

          // 💡 修正ポイント：すべての行のループが終わった「後」で、1回だけ画面に結果を反映する
          search_result = result;
          resultDisplay(search_result);
        } catch (err) {
          if (err.name === "NotFoundError") {
            console.error(`ファイルが見つかりません: ${csvFile}`);
            alert(
              `フォルダ内に指定されたファイル「${csvFile}」が存在しません。`,
            );
          } else {
            console.error(
              "検索用ファイルの読み込み中にエラーが発生しました:",
              err,
            );
          }
        }
      }

      // 選手指定検索
      // IN: csvFile 検索対象CSVファイル名
      // IN: player  選手名
      async function searchplayer(csvFile, player) {
        let result = "";
        search_result = "";

        try {
          // 1. 保存してあるフォルダ（directoryHandle）から直接引数のCSVファイルを取得
          const fileHandle = await directoryHandle.getFileHandle(csvFile);

          // 2. ファイルオブジェクトを取得
          const file = await fileHandle.getFile();

          // 3. FileReaderを使わずに、直接テキスト（UTF-8）として読み込む
          const content = await file.text();

          // 改行で分割して配列にする
          const lines = content.split("\n");
          let index = 0;

          // 1行ずつ順番に処理を実行
          lines.forEach((line) => {
            if (!line.trim()) return;

            const cols = line.split(",");

            // 💡 修正ポイント：インデックス[4]番目の「選手名」を安全に判定
            if ((cols && cols[4]?.trim() === player) || index === 0) {
              index++;

              // 💡 修正ポイント：インデックスの各数字を確実に維持し、安全に文字列を結合
              const str =
                (cols[0] ? cols[0].trim() : "") +
                "," + // 大会名
                (cols[3] ? cols[3].trim() : "") +
                "," + // 順位
                (cols[6] ? cols[6].trim() : "") +
                "," + // 合計得点
                (cols[7] ? cols[7].trim() : "") +
                "," + // 1本目飛距離
                (cols[8] ? cols[8].trim() : "") +
                "," + // 1本目飛距離点
                (cols[9] ? cols[9].trim() : "") +
                "," + // 1本目飛型点
                (cols[10] ? cols[10].trim() : "") +
                "," + // 1本目得点
                (cols[11] ? cols[11].trim() : "") +
                "," + // 1本目順位
                (cols[12] ? cols[12].trim() : "") +
                "," + // 2本目飛距離
                (cols[13] ? cols[13].trim() : "") +
                "," + // 2本目飛距離点
                (cols[14] ? cols[14].trim() : "") +
                "," + // 2本目飛型点
                (cols[15] ? cols[15].trim() : "") +
                "," + // 2本目得点
                (cols[16] ? cols[16].trim() : "") +
                "," + // 2本目得点
                (cols[17] ? cols[17].trim() : "") +
                "\n"; // ポイント

              result += str;
            }
          });

          // 💡 修正ポイント：すべての行のループが終わった「後」で、1回だけ画面に結果を反映する
          search_result = result;
          resultDisplay(search_result);
        } catch (err) {
          if (err.name === "NotFoundError") {
            console.error(`ファイルが見つかりません: ${csvFile}`);
            alert(
              `フォルダ内に指定されたファイル「${csvFile}」が存在しません。`,
            );
          } else {
            console.error("選手データの読み込み中にエラーが発生しました:", err);
          }
        }
      }

      const RESULT_CSV_FILE_JP = "result_jp.csv";
      const RESULT_CSV_FILE_WC = "result_wc.csv";
      const RESULT_CSV_FILE_CC = "result_cc.csv";
      const RESULT_CSV_FILE_SG = "result_sg.csv";
      const ORVERALL_CSV_FILE_JP = "overall_jp.csv";
      const ORVERALL_CSV_FILE_WC = "overall_wc.csv";
      const ORVERALL_CSV_FILE_CC = "overall_cc.csv";
      const ORVERALL_CSV_FILE_SG = "overall_sg.csv";

      // 検索対象CSVファイル名取得
      // IN: opt1 大会区分
      // IN: opt2 総合順位／個人／大会
      function getResultCsvFile(opt1, opt2) {
        let csvFile = "";
        if (opt2 === "option2_overall") {
          if (opt1 === OPTION1_VALUE_JP) {
            csvFile = ORVERALL_CSV_FILE_JP;
          } else if (opt1 === OPTION1_VALUE_WC) {
            csvFile = ORVERALL_CSV_FILE_WC;
          } else if (opt1 === OPTION1_VALUE_CC) {
            csvFile = ORVERALL_CSV_FILE_CC;
          } else if (opt1 === OPTION1_VALUE_SG) {
            csvFile = ORVERALL_CSV_FILE_SG;
          }
        } else {
          if (opt1 === OPTION1_VALUE_JP) {
            csvFile = RESULT_CSV_FILE_JP;
          } else if (opt1 === OPTION1_VALUE_WC) {
            csvFile = RESULT_CSV_FILE_WC;
          } else if (opt1 === OPTION1_VALUE_CC) {
            csvFile = RESULT_CSV_FILE_CC;
          } else if (opt1 === OPTION1_VALUE_SG) {
            csvFile = RESULT_CSV_FILE_SG;
          }
        }
        return csvFile;
      }

      // 大会名取得
      function getCompetitionName() {
        const compSelect = document.getElementById("compSelectBox");
        return compSelect.value;
      }

      // 選手名取得
      function getPlayerName() {
        const playerSelect = document.getElementById("playerSelectBox");
        return playerSelect.value;
      }

      // 検索
      function search() {
        console.log("search()");
        // 結果CSVファイル名取得
        const option1Value = document.querySelector(
          'input[name="option1"]:checked',
        ).value;
        const option2Value = document.querySelector(
          'input[name="option2"]:checked',
        ).value;

        const csvFile = getResultCsvFile(option1Value, option2Value);

        let result = "";
        if (option2Value === "option2_overall") {
          const option3Value = document.querySelector(
            'input[name="option3"]:checked',
          ).value;
          searchOverall(csvFile, option1Value, option3Value, option2Value);
        } else if (option2Value === "option2_competition") {
          const option4Value = document.querySelector(
            'input[name="option4"]:checked',
          ).value;
          const competitionName = getCompetitionName();
          searchCompetition(csvFile, competitionName, option4Value);
        } else if (option2Value === "option2_personal") {
          const playerName = getPlayerName();
          searchplayer(csvFile, playerName);
        } else {
        }

        return result;
      }

      // 検索結果を表示する
      // IN:resultList csv形式文字列のリスト
      //               1レコード目はヘッダ情報
      function resultDisplay(resultList) {
        console.log(resultList);
        const lines = resultList.trim().split("\n");
        // ヘッダ表示
        const cols = lines[0].split(",");
        let tableHdrHTML =
          '<table style="border-collapse: collapse; width: 100%; margin-top: 15px;">';
        tableHdrHTML += "<tr>";
        for (const item of cols) {
          const trimmedItem = item.trim();
          tableHdrHTML += `<th style="border: 1px solid #999; padding: 8px; background: #e0e0e0;">${trimmedItem}</td>`;
        }
        tableHdrHTML += "</tr>";
        tableHdrHTML += "</table>";
        document.getElementById("tableHeader").innerHTML = tableHdrHTML;

        // 検索結果表示
        let tableBodyHTML =
          '<table style="border-collapse: collapse; width: 100%;">';
        tableBodyHTML += "<tr>";
        for (let i = 1; i < lines.length; i++) {
          if (!lines[i]) continue;
          const cols = lines[i].split(",");
          for (const item of cols) {
            const trimmedItem = item.trim();
            tableBodyHTML += `<th style="border: 1px solid #999; padding: 8px; background: #f2f2f2;">${trimmedItem}</td>`;
          }
          tableBodyHTML += "</tr>";
          tableBodyHTML += "</table>";
        }

        document.getElementById("tableBody").innerHTML = tableBodyHTML;

        dispTable.style.display = "table";
      }
    </script>
  </body>
</html>
