    <style>
      html {

      }

      .table-responsive-wrapper,

        padding: 8px;

      }

        padding: 8px;
        white-space: nowrap; /* 文字数に合わせて列幅を自動調整 */

    <script>
      let version;

      fetch('data/version.txt') // サーバ上のファイルパス
        .then(response => response.text())
        .then(text => {
        const cleanText = text.trim(); // 前後の空白や改行を消す
        // yyyymmdd (8桁の数字) を yyyy/mm/dd に変換
        const formatted = cleanText.replace(/^(\d{4})(\d{2})(\d{2})$/, '$1/$2/$3');
        document.getElementById('date-view').textContent = formatted;
        version = cleanText;
      })
      .catch(error => {
        document.getElementById('date-view').textContent = '読み込みエラー';
      });


      // 検索オプション1 大会区分
      const OPTION1_VALUE_JP = "1";
      const OPTION1_VALUE_WC = "2";
      const OPTION1_VALUE_CC = "3";
      const OPTION1_VALUE_SG = "4";

      // フォルダ選択ボタン
      const folderInput = document.getElementById("folderInput");
      const customBtn = document.getElementById("customBtn");

      // オプション1選択ラジオボタン
      const radioArea1 = document.getElementById("radioArea1");
      // オプション2選択ラジオボタン
      const radioArea2 = document.getElementById("radioArea2");
      // オプション3選択ラジオボタン
      const radioArea3 = document.getElementById("radioArea3");
      // 大会選択ボックス
      const compSelectBox = document.getElementById("compSelectBox");
      // オプション4選択ラジオボタン
      const radioArea4 = document.getElementById("radioArea4");
      // 検索ボタン
      const searchBtn = document.getElementById("searchBtn");

      const GITHUB_ZIP_FILE_NAME = "data/result.zip";
      //const GITHUB_ZIP_FILE_NAME = "data/version.txt";

      let directoryHandle;

      
      async function dataDownLoad() {
        return new Promise((resolve, reject) => {
          //  statusDiv.innerHTML = "2. サーバーから最新の圧縮ファイルを取得中...";
          console.log("dataDownload 1: 通信開始");

          // XMLHttpRequestでバイナリデータを取得します
          const xhr = new XMLHttpRequest();
          xhr.open(
            "GET",
            GITHUB_ZIP_FILE_NAME + "?t=" + new Date().getTime(),
            true,
          ); // キャッシュ対策のパラメータ付き
          xhr.responseType = "arraybuffer"; // arraybuffer として受け取る指定

          xhr.onload = async function () {
            console.log("dataDownload 2: ステータス確認", xhr.status);

            if (xhr.status !== 200) {
              statusDiv.className = "error";
              statusDiv.innerHTML = `ファイル取得に失敗しました。ステータスコード: ${xhr.status}\n同じフォルダ内に「${LOCAL_ZIP_FILE_NAME}」があるか確認してください。`;
              // 待機を解除する
              reject(new Error(`ステータスコード: ${xhr.status}`));
              return;
            }

            const zipBuffer = xhr.response;
            console.log(
              "dataDownload 3: バイナリデータの取得成功。バイト数:",
              zipBuffer.byteLength,
            );

            try {
              // JSZipライブラリを使ってブラウザ内で展開
              const zip = new JSZip();
              const unzippedData = await zip.loadAsync(zipBuffer);

              let fileCount = 0;
              for (const relativePath in unzippedData.files) {
                const zipEntry = unzippedData.files[relativePath];

                if (!zipEntry.dir) {
                  if (
                    zipEntry.name.startsWith(".") ||
                    zipEntry.name.includes("__MACOSX")
                  ) {
                    console.log(
                      `システムファイルのためスキップしました: ${zipEntry.name}`,
                    );
                    continue; // 保存せずに次のファイルへ進む
                  }
                  const fileBlob = await zipEntry.async("blob");

                  // 選択されたフォルダ内に同名ファイルを作成・上書き
                  const fileHandle = await directoryHandle.getFileHandle(
                    zipEntry.name,
                    { create: true },
                  );
                  const writable = await fileHandle.createWritable();
                  await writable.write(fileBlob);
                  await writable.close();
                  fileCount++;
                }
              }

              console.log("dataDownload 4: すべての処理が正常完了しました");

              // ========================================================
              // 💡 完了通知！ これを呼ぶことで、ボタン側の「await dataDownLoad()」の
              // 一時停止が解除され、次のラジオボタン非表示などの処理へ進みます。
              // ========================================================
              resolve();
            } catch (unzipErr) {
              console.error("エラー詳細:", unzipErr);
              // 待機を解除する
              reject(unzipErr);
            }
          };

          xhr.onerror = function () {
            console.error("XHR通信エラー");
            reject(new Error("ネットワークエラーが発生しました。"));
          };

          xhr.send();
        });
      }

      // フォルダが選択時の処理
      // 選択されたフォルダ内のファイルのリストを取得
      customBtn.addEventListener("click", async (event) => {
        directoryHandle = await window.showDirectoryPicker({
          mode: "readwrite",
        });

        // ファイルダウンロード
        await dataDownLoad();

        // option2ラジオボタンを非表示
        radioArea2.style.display = "none";
        const option2Radios = document.getElementsByName("option2");
        option2Radios.forEach((radio) => {
          radio.checked = false;
        });

        // option3ラジオボタンを非表示
        radioArea3.style.display = "none";
        const option3Radios = document.getElementsByName("option3");
        option3Radios.forEach((radio) => {
          radio.checked = false;
        });

        // option4ラジオボタンを非表示
        radioArea4.style.display = "none";
        const option4Radios = document.getElementsByName("option4");
        option4Radios.forEach((radio) => {
          radio.checked = false;
        });

        // 大会選択ボックスを非表示
        compSelectBox.style.display = "none";

        // 選手選択ボックスを非表示
        playerSelectBox.style.display = "none";

        // 国選択ボックスを非表示
        countrySelectBox.style.display = "none";
        document.getElementById('countrySelectArea').style.display = 'none';

        // 検索ボタン非表示
        searchBtn.style.display = "none";

        // 表を非表示
        //dispTable.style.display = "none";
        //dispTable1.style.display = "none";
        //overallTable.style.display = "none";
        document.getElementById('dispTableWrapper').style.display = 'none';
        document.getElementById('dispTable1Wrapper').style.display = 'none';
        document.getElementById('overallTableWrapper').style.display = 'none';

        // オプション1選択ラジオボタン表示
        // 国内戦／ワールドカップ／コンチネンタルカップ／サマーグランプリ
        const option1Radios = document.getElementsByName("option1");
        option1Radios.forEach((radio) => {
          radio.checked = false;
        });
        radioArea1.style.display = "block";

        // showDirectoryPicker用の正しいファイル一覧取得処理
        const filePaths = [];

        // フォルダ内を非同期でループ処理し、ファイル名を集める
        for await (const entry of directoryHandle.values()) {
          if (entry.kind === "file") {
            filePaths.push(entry.name);
          }
        }

        // 選択された全ファイルのリストをそのまま保存
        window.selectedFiles = event.target.files;
      });

      // option1ラジオボタンを変更した場合の処理
      document.getElementsByName("option1").forEach((radio) => {
        radio.addEventListener("change", (e) => {
          // オプション2選択ラジオボタン表示
          const option2Radios = document.getElementsByName("option2");
          option2Radios.forEach((radio) => {
            radio.checked = false;
          });
          radioArea2.style.display = "block";

          // option3ラジオボタンを非表示
          radioArea3.style.display = "none";
          const option3Radios = document.getElementsByName("option3");
          option3Radios.forEach((radio) => {
            radio.checked = false;
          });

          // option4ラジオボタンを非表示
          radioArea4.style.display = "none";
          const option4Radios = document.getElementsByName("option4");
          option4Radios.forEach((radio) => {
            radio.checked = false;
          });

          // 大会選択ボックスを非表示
          compSelectBox.style.display = "none";

          // 選手選択ボックスを非表示
          playerSelectBox.style.display = "none";

          // 国選択ボックスを非表示
          countrySelectBox.style.display = "none";
          document.getElementById('countrySelectArea').style.display = 'none';
          overallCountrySelect.style.display = "none";

          // 検索ボタン非表示
          searchBtn.style.display = "none";

          // 表を非表示
          //dispTable.style.display = "none";
          //dispTable1.style.display = "none";
          //overallTable.style.display = "none";
          document.getElementById('dispTableWrapper').style.display = 'none';
          document.getElementById('dispTable1Wrapper').style.display = 'none';
          document.getElementById('overallTableWrapper').style.display = 'none';
        });
      });

      // option2ラジオボタンを変更した場合の処理
      // 総合順位／個人／大会
      document.getElementsByName("option2").forEach((radio) => {
        radio.addEventListener("change", async (e) => {
          // option2 選択項目取得
          const select_option = document.querySelector(
            'input[name="option2"]:checked',
          ).value;

          // 検索ボタン非表示
          searchBtn.style.display = "none";

          // option4ラジオボタンを非表示
          radioArea4.style.display = "none";
          const option4Radios = document.getElementsByName("option4");
          option4Radios.forEach((radio) => {
            radio.checked = false;
          });

          // option3ラジオボタンを初期化
          const option3Radios = document.getElementsByName("option3");
          option3Radios.forEach((radio) => {
            radio.checked = false;
          });

          // 大会選択ボックスを非表示
          compSelectBox.style.display = "none";

          // 選手選択ボックスを非表示
          playerSelectBox.style.display = "none";

          // 国選択ボックスを非表示
          countrySelectBox.style.display = "none";
          document.getElementById('countrySelectArea').style.display = 'none';
          overallCountrySelect.style.display = "none";

          // 表を非表示
          //dispTable.style.display = "none";
          //dispTable1.style.display = "none";
          //overallTable.style.display = "none";
          document.getElementById('dispTableWrapper').style.display = 'none';
          document.getElementById('dispTable1Wrapper').style.display = 'none';
          document.getElementById('overallTableWrapper').style.display = 'none';

          // 「総合順位」「個人」が選択された場合
          if (
            select_option === "option2_overall" ||
            select_option === "option2_personal"
          ) {
            // option3ラジオボタンが非表示の場合
            if (radioArea3.style.display === "none") {
              // option3ラジオボタンを表示
              radioArea3.style.display = "block";
            }
          } else {
            // option3ラジオボタンが表示されている場合

                "," + // 1本目飛型点
                (cols[10] ? cols[10].trim() : "") +
                "," + // 1本目得点
                (cols[11] ? cols[11].trim() : "") +
                "," + // 1本目順位
                (cols[12] ? cols[12].trim() : "") +
                "," + // 2本目飛距離
                (cols[13] ? cols[13].trim() : "") +
                "," + // 2本目飛距離点
                (cols[14] ? cols[14].trim() : "") +
                "," + // 2本目飛型点
                (cols[15] ? cols[15].trim() : "") +
                "," + // 2本目得点
                (cols[16] ? cols[16].trim() : "") +
                "," + // 2本目得点
                (cols[17] ? cols[17].trim() : "") +
                "\n"; // ポイント

              result += str;
            }
          });

          // すべての行のループが終わった「後」で、1回だけ画面に結果を反映する
          search_result = result;
        } catch (err) {
          if (err.name === "NotFoundError") {
            console.error(`ファイルが見つかりません: ${csvFile}`);
            alert(
              `フォルダ内に指定されたファイル「${csvFile}」が存在しません。`,
            );
          } else {
            console.error("選手データの読み込み中にエラーが発生しました:", err);
          }
        }
      }

      // 選手指定検索総合順位
      // csvFile 検索対象CSVファイル名
      // player  選手名
      async function searchplayerOverall(csvFile, player) {
        let result = "";
        search_result = "";

        try {
          // 1. 保存してあるフォルダ（directoryHandle）から直接引数のCSVファイルを取得
          const fileHandle = await directoryHandle.getFileHandle(csvFile);

          // 2. ファイルオブジェクトを取得
          const file = await fileHandle.getFile();

          // 3. FileReaderを使わずに、直接テキスト（UTF-8）として読み込む
          const content = await file.text();

          // 改行で分割して配列にする
          const lines = content.split("\n");
          let index = 0;

          // 1行ずつ順番に処理を実行
          lines.forEach((line) => {
            if (!line.trim()) return;

            const cols = line.split(",");

            // インデックス[4]番目の「選手名」を安全に判定
            if ((cols && cols[4]?.trim() === player) || index === 0) {
              index++;

              // インデックスの各数字を確実に維持し、安全に文字列を結合
              const str =
                (cols[0] ? cols[0].trim() : "") +
                "," + // 大会名
                (cols[3] ? cols[3].trim() : "") +
                "," + // 順位
                //  (cols[6] ? cols[6].trim() : "") +
                //  "," + // 合計得点
                //  (cols[7] ? cols[7].trim() : "") +
                //  "," + // 1本目飛距離
                //  (cols[8] ? cols[8].trim() : "") +
                //  "," + // 1本目飛距離点
                //  (cols[9] ? cols[9].trim() : "") +
                //  "," + // 1本目飛型点
                //  (cols[10] ? cols[10].trim() : "") +
                //  "," + // 1本目得点
                //  (cols[11] ? cols[11].trim() : "") +
                //  "," + // 1本目順位
                //  (cols[12] ? cols[12].trim() : "") +
                //  "," + // 2本目飛距離
                //  (cols[13] ? cols[13].trim() : "") +
                //  "," + // 2本目飛距離点
                //  (cols[14] ? cols[14].trim() : "") +
                //  "," + // 2本目飛型点
                //  (cols[15] ? cols[15].trim() : "") +
                //  "," + // 2本目得点
                //  (cols[16] ? cols[16].trim() : "") +
                //  "," + // 2本目得点
                (cols[17] ? cols[17].trim() : "") +
                "\n"; // ポイント

              result += str;
            }
          });

          // すべての行のループが終わった「後」で、1回だけ画面に結果を反映する
          search_result = result;
        } catch (err) {
          if (err.name === "NotFoundError") {
            console.error(`ファイルが見つかりません: ${csvFile}`);
            alert(
              `フォルダ内に指定されたファイル「${csvFile}」が存在しません。`,
            );
          } else {
            console.error("選手データの読み込み中にエラーが発生しました:", err);
          }
        }
      }

      const RESULT_CSV_FILE_JP = "result_jp.csv";
      const RESULT_CSV_FILE_WC = "result_wc.csv";
      const RESULT_CSV_FILE_CC = "result_cc.csv";
      const RESULT_CSV_FILE_SG = "result_sg.csv";
      const ORVERALL_CSV_FILE_JP = "overall_jp.csv";
      const ORVERALL_CSV_FILE_WC = "overall_wc.csv";
      const ORVERALL_CSV_FILE_CC = "overall_cc.csv";
      const ORVERALL_CSV_FILE_SG = "overall_sg.csv";

      // 検索対象CSVファイル名取得
      // opt1 大会区分
      // opt2 総合順位／個人／大会
      function getResultCsvFile(opt1, opt2) {
        let csvFile = "";
        if (opt2 === "option2_overall") {
          if (opt1 === OPTION1_VALUE_JP) {
            csvFile = ORVERALL_CSV_FILE_JP;
          } else if (opt1 === OPTION1_VALUE_WC) {
            csvFile = ORVERALL_CSV_FILE_WC;
          } else if (opt1 === OPTION1_VALUE_CC) {
            csvFile = ORVERALL_CSV_FILE_CC;
          } else if (opt1 === OPTION1_VALUE_SG) {
            csvFile = ORVERALL_CSV_FILE_SG;
          }
        } else {
          if (opt1 === OPTION1_VALUE_JP) {
            csvFile = RESULT_CSV_FILE_JP;
          } else if (opt1 === OPTION1_VALUE_WC) {
            csvFile = RESULT_CSV_FILE_WC;
          } else if (opt1 === OPTION1_VALUE_CC) {
            csvFile = RESULT_CSV_FILE_CC;
          } else if (opt1 === OPTION1_VALUE_SG) {
            csvFile = RESULT_CSV_FILE_SG;
          }
        }
        return csvFile;
      }

      // 大会名取得
      function getCompetitionName() {
        const compSelect = document.getElementById("compSelectBox");
        return compSelect.value;
      }

      // 選手名取得
      function getPlayerName() {
        const playerSelect = document.getElementById("playerSelectBox");
        return playerSelect.value;
      }

      // 検索
      async function search() {
        // 結果CSVファイル名取得
        const option1Value = document.querySelector(
          'input[name="option1"]:checked',
        ).value;
        const option2Value = document.querySelector(
          'input[name="option2"]:checked',
        ).value;

        const csvFile = getResultCsvFile(option1Value, option2Value);

        let result = "";
        if (option2Value === "option2_overall") {
          // 総合順位の場合
          const option3Value = document.querySelector(
            'input[name="option3"]:checked',
          ).value;
          await searchOverall(
            csvFile,
            option1Value,
            option3Value,
            option2Value,
          );
          overallDisplayTableSet("overallHeader", "overallBody", search_result);
          //overallTable.style.display = "table";
          document.getElementById('overallTableWrapper').style.display = 'block';
        } else if (option2Value === "option2_competition") {
          // 大会の場合
          const option4Value = document.querySelector(
            'input[name="option4"]:checked',
          ).value;
          const competitionName = getCompetitionName();
          await searchCompetition(csvFile, competitionName, option4Value);
          resultDisplayTableSet("tableHeader", "tableBody", search_result);
          //dispTable.style.display = "table";
          document.getElementById('dispTableWrapper').style.display = 'block';
        } else if (option2Value === "option2_personal") {
          // 個人の場合
          const playerName = getPlayerName();
          const option3Value = document.querySelector(
            'input[name="option3"]:checked',
          ).value;
          const csvFileOvrall = getResultCsvFile(
            option1Value,
            "option2_overall",
          );
          await searchOverall(
            csvFileOvrall,
            option1Value,
            option3Value,
            option2Value,
          );
          resultDisplayTableSet("tableHeader", "tableBody", search_result);
          await searchplayer(csvFile, playerName);
          resultDisplayTableSet("tableHeader1", "tableBody1", search_result);
          //dispTable.style.display = "table";
          //dispTable1.style.display = "table";
          document.getElementById('dispTableWrapper').style.display = 'block';
          document.getElementById('dispTable1Wrapper').style.display = 'block';
        } else {
        }

        return result;
      }

      // 表示テーブル設定
      function resultDisplayTableSet(headerId, bodyId, resultList) {
        const headerRow = document.getElementById(headerId);
        const tableBody = document.getElementById(bodyId);

        const lines = resultList.trim().split("\n");
        if (lines.length === 0 || !lines[0]) return;

        // ヘッダ表示
        const cols = lines[0].split(",");
        let tableHdrHTML = "";
        for (const item of cols) {
          const trimmedItem = item.trim();
          tableHdrHTML += `<th style="border: 1px solid #999; padding: 8px; background: #e0e0e0;">${trimmedItem}</th>`;
        }
        headerRow.innerHTML = tableHdrHTML;

        // 検索結果表示
        let tableBodyHTML = "";
        for (let i = 1; i < lines.length; i++) {
          if (!lines[i]) continue;
          const cols = lines[i].split(",");
          tableBodyHTML += "<tr>"; // 行の開始

          for (const item of cols) {
            const trimmedItem = item.trim();
            // データ行なので <th> ではなく <td> に修正し、正しく </td> で閉じます
            tableBodyHTML += `<td style="border: 1px solid #999; padding: 8px; background: #ffffff;">${trimmedItem}</td>`;
          }
          tableBodyHTML += "</tr>"; // 行の終了
        }

        tableBody.innerHTML = tableBodyHTML;

        // テーブルのデータ設定が終わった後に実行する処理
        function enableTableScroll(tableId) {
          const table = document.getElementById(tableId);
          if (!table) return;

          // すでにラッパー（器）で囲まれている場合は、二重に囲まないようにスキップ
          if (
            table.parentElement.classList.contains("table-responsive-wrapper")
          ) {
            return;
          }

          // 1. スクロール用の div を新しく作成
          const wrapper = document.createElement("div");
          wrapper.className = "table-responsive-wrapper";

          // 2. テーブルの直前に div を挿入し、その中にテーブルを移動する
          table.parentNode.insertBefore(wrapper, table);
          wrapper.appendChild(table);
        }

        // データを入れ終わったタイミングで、それぞれのテーブルIDを指定して呼び出します
        //enableTableScroll("dispTable");
        //enableTableScroll("dispTable1");
        enableTableScroll("dispTableWrapper");
        enableTableScroll("dispTable1Wrapper");
      }

      // 総合結果テーブル設定
      async function overallDisplayTableSet(headerId, bodyId, resultList) {
        const headerRow = document.getElementById(headerId);
        const tableBody = document.getElementById(bodyId);

        const lines = resultList.trim().split("\n");
        // ヘッダ表示
        const cols = lines[0].split(",");

        let tableHdrHTML = ""; // <tr>の中身だけにする（元々の <tr> タグを活かすため）
        for (const item of cols) {
          const trimmedItem = item.trim();
          tableHdrHTML += `<th style="border: 1px solid #999; padding: 8px; background: #e0e0e0;">${trimmedItem}</th>`;
        }

        headerRow.innerHTML = tableHdrHTML;

        // 検索結果表示
        let tableBodyHTML = ""; // <tr>の中身だけにする（元々の <tbody> タグを活かすため）

        const playerNameColumnIndex = 1;

        for (let i = 1; i < lines.length; i++) {
          if (!lines[i]) continue;
          const cols = lines[i].split(",");

          tableBodyHTML += "<tr>";
          for (let j = 0; j < cols.length; j++) {
            const trimmedItem = cols[j].trim();

            // 選手名の列（カラム）のときだけ、クリック用の目印（クラスやスタイル）をつける
            if (j === playerNameColumnIndex) {
              tableBodyHTML += `<td class="clickable-player" style="border: 1px solid #999; padding: 8px; background: #f2f2f2; cursor: pointer; color: blue; text-decoration: underline;">${trimmedItem}</td>`;
            } else {
              // 通常のデータセル（<td>に変更）
              tableBodyHTML += `<td style="border: 1px solid #999; padding: 8px; background: #f2f2f2;">${trimmedItem}</td>`;
            }
          }
          tableBodyHTML += "</tr>";
        }

        tableBody.innerHTML = tableBodyHTML;

        // クリックイベントの設定（1回だけ設定されるようにする） ---
        //const overallTable = document.getElementById("overallTable");
        const overallTable = document.getElementById("overallTableWrapper");

        // イベントの重複登録を防ぐため、一度削除してから登録（または一度だけ実行）
        overallTable.onclick = null; // 初期化
        overallTable.onclick = async function (event) {
          //const overallTable = document.getElementById("overallTable");
          const overallTable = document.getElementById("overallTableWrapper");

          // クリックされたセルが「選手名」かチェック
          const cell = event.target.closest(".clickable-player");
          if (!cell) return;

          const playerName = cell.textContent;

          // 1. 先に古いポップアップが残っていれば画面から完全に消去する
          const oldPopup = document.getElementById("dynamicPlayerPopup");
          if (oldPopup) oldPopup.remove();

          // 2. クリックされたセルの「ページ全体から見た絶対座標」を正確に計算
          const cellRect = cell.getBoundingClientRect();
          const pageTop = cellRect.top + window.pageYOffset;
          const pageLeft = cellRect.right + window.pageXOffset;

          // 3. データの取得
          const option1Value = document.querySelector(
            'input[name="option1"]:checked',
          ).value;
          const option2Value = document.querySelector(
            'input[name="option2"]:checked',
          ).value;
          const csvFile = getResultCsvFile(option1Value, "option2_personal");

          await searchplayerOverall(csvFile, playerName);

          // 独立したHTMLを組み立てる
          const lines = search_result.trim().split("\n");
          if (lines.length === 0 || !lines) return;

          // テーブルの外枠を生成
          let popupHTML = `<table id="dynamicPlayerPopup" class="player-popup-container" style="top: ${pageTop}px; left: ${pageLeft + 150}px;">`;

          // ヘッダー行の組み立て
          const cols = lines[0].split(",");
          popupHTML += "<thead><tr>";
          for (const item of cols) {
            popupHTML += `<th style="background: #e0e0e0;">${item.trim()}</th>`;
          }
          popupHTML += "</tr></thead><tbody>";

          // データ行の組み立て
          for (let i = 1; i < lines.length; i++) {
            if (!lines[i]) continue;
            const bodyCols = lines[i].split(",");
            popupHTML += "<tr>";
            for (const item of bodyCols) {
              popupHTML += `<td style="background: #ffffff;">${item.trim()}</td>`;
            }
            popupHTML += "</tr>";
          }
          popupHTML += "</tbody></table>";

          // 5. 組み立てた「完全独立テーブル」を、総合テーブルとは全く無関係な body の直下に一瞬で挿入する
          document.body.insertAdjacentHTML("beforeend", popupHTML);

          // イベントの伝播を止めて、自動で消えるのを防ぐ
          event.stopPropagation();
        };

        // 選手成績テーブル以外の場所をクリックしたら自動で閉じる（非表示）
        document.addEventListener("click", function (event) {
          const popup = document.getElementById("dynamicPlayerPopup");
          if (popup && !popup.contains(event.target)) {
            popup.remove();
          }
        });
      }
    </script>
